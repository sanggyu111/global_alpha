# 로컬 개발용 PostgreSQL 15 (ZIVO 운영 버전과 동일)
# 사용: cp .env.example .env  →  docker compose up -d
# 계정 정보는 .env 에서 읽는다 (.env 는 커밋하지 않음).
services:
  postgres:
    image: postgres:15-alpine
    container_name: staypoint-postgres
    environment:
      POSTGRES_DB: staypoint
      POSTGRES_USER: ${DB_USERNAME:?.env 파일에 DB_USERNAME 을 설정하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 파일에 DB_PASSWORD 를 설정하세요}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - staypoint-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d staypoint"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  staypoint-pgdata:
