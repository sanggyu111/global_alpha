spring:
  application:
    name: staypoint
  datasource:
    # 로컬: docker compose 의 PostgreSQL. 배포: 플랫폼 환경변수로 덮어쓴다 (설계 9장)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/staypoint}
    username: ${DB_USERNAME:staypoint}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # 커넥션을 오래 기다리지 말고 빨리 실패 (설계 4.1 깨지는 조건 3)
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 가 만든다. JPA 는 엔티티와 테이블이 맞는지 검증만 한다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

staypoint:
  zone-id: Asia/Seoul
  hold-minutes: 10
  # @Scheduled 작업 전체 on/off (테스트에서는 끈다)
  scheduling:
    enabled: true
  hold-expiry:
    interval-ms: 30000
    batch-size: 100
  cancel-retry:
    max-attempts: 5

---
# 데모 데이터(숙소·객실·90일치 재고/요금). 로컬과 데모 배포에서 켠다: SPRING_PROFILES_ACTIVE=seed
spring:
  config:
    activate:
      on-profile: seed
  flyway:
    locations: classpath:db/migration,classpath:db/seed
