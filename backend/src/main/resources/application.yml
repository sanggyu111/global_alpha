spring:
  application:
    name: staypoint
  datasource:
    # 로컬: docker compose 의 PostgreSQL. 배포: 플랫폼 환경변수로 덮어쓴다 (설계 9장)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/staypoint}
    username: ${DB_USERNAME:staypoint}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # 커넥션을 오래 기다리지 말고 빨리 실패 (설계 4.1 깨지는 조건 3)
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 가 만든다. JPA 는 엔티티와 테이블이 맞는지 검증만 한다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

staypoint:
  zone-id: Asia/Seoul
  hold-minutes: 10
  # @Scheduled 작업 전체 on/off (테스트에서는 끈다)
  scheduling:
    enabled: true
  hold-expiry:
    interval-ms: 30000
    batch-size: 100
  pg:
    # "/" 로 시작하면 이 앱 자신의 주소 기준 (같은 앱 안의 모의 PG 를 HTTP 로 호출)
    base-url: /mock-pg
    connect-timeout-ms: 1000
    # 이 시간 안에 승인 응답이 없으면 PROCESSING 으로 응답하고 웹훅·상태 확정 스케줄러에 맡긴다
    read-timeout-ms: 3000
    webhook-secret: ${MOCKPG_WEBHOOK_SECRET:}
  payment-reconcile:
    interval-ms: 30000
    ready-threshold-seconds: 60
    batch-size: 50
  cancel-retry:
    max-attempts: 5

# 모의 PG 장애 주입 (설계 5장). 승인·취소 API 의 ?failRate=&delayMs= 로 요청마다 덮어쓸 수 있다
mockpg:
  approve:
    fail-rate: 0.1
    delay-ms: 300
  cancel:
    fail-rate: 0.0
  webhook:
    enabled: true
    duplicate-count: 2
    # "/" 로 시작하면 이 앱 자신의 주소 기준
    url: /api/payments/webhook
    # 비어 있으면 웹훅을 보내지 않는다. 값은 .env / 플랫폼 환경변수로만 (커밋 금지)
    secret: ${MOCKPG_WEBHOOK_SECRET:}

---
# 데모 데이터(숙소·객실·90일치 재고/요금). 로컬과 데모 배포에서 켠다: SPRING_PROFILES_ACTIVE=seed
spring:
  config:
    activate:
      on-profile: seed
  flyway:
    locations: classpath:db/migration,classpath:db/seed
