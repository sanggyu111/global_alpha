  h1 small { color: var(--muted); font-weight: 500; font-size: 0.9rem; margin-left: 6px; }
  a { color: var(--accent); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .v { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .k { color: var(--muted); font-size: 0.8rem; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .filters select, .filters input {
    font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; min-height: 34px;
  }
  .filters input { flex: 1 1 200px; }
  .count { color: var(--muted); font-size: 0.85rem; }

  .entry { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .entry.t-error { border-left-color: var(--error); } .entry.t-change { border-left-color: var(--change); }
  .entry.t-decision { border-left-color: var(--decision); } .entry.t-fix { border-left-color: var(--fix); }
  .entry .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 0.8rem; color: var(--muted); }
  .entry .id { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .entry h3 { margin: 6px 0 8px; font-size: 1rem; }
  dl { margin: 0; display: grid; grid-template-columns: 64px 1fr; gap: 4px 12px; }
  dt { color: var(--muted); font-size: 0.8rem; padding-top: 2px; }
  dd { margin: 0; overflow-wrap: anywhere; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; background: var(--chip-bg); font-size: 0.75rem; font-weight: 600; }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .c-error { color: var(--error); } .c-change { color: var(--change); } .c-decision { color: var(--decision); } .c-fix { color: var(--fix); }
  .c-resolved { color: var(--resolved); } .c-open { color: var(--open); } .c-watch { color: var(--watch); }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 0.8rem; background: var(--chip-bg); padding: 1px 5px; border-radius: 4px; }
  .refs code { margin-right: 4px; }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>STAYPOINT <small>작업 로그 · 오류와 변경 기록</small></h1>
    <a href="progress.html">진행 현황 보기 →</a>
  </header>

  <div class="stats" id="stats"></div>

  <div class="filters">
    <select id="f-type" aria-label="유형">
      <option value="">모든 유형</option>
      <option value="error">오류</option><option value="change">변경</option>
      <option value="decision">결정</option><option value="fix">수정</option>
    </select>
    <select id="f-status" aria-label="상태">
      <option value="">모든 상태</option>
      <option value="open">미해결</option><option value="watch">관찰 중</option><option value="resolved">해결</option>
    </select>
    <select id="f-task" aria-label="Task"></select>
    <input id="f-q" type="search" placeholder="검색 (제목·내용·원인·조치)">
    <span class="count" id="count"></span>
  </div>

  <div id="list"></div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // `code` 표기를 <code> 로
  const fmt = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  const TYPE = { error: "오류", change: "변경", decision: "결정", fix: "수정" };
  const STATUS = { resolved: "해결", open: "미해결", watch: "관찰 중" };

  const count = (pred) => LOG.filter(pred).length;
  $("stats").innerHTML = [
    ["전체", LOG.length],
    ["오류", count((e) => e.type === "error")],
    ["변경 · 결정", count((e) => e.type === "change" || e.type === "decision")],
    ["미해결", count((e) => e.status === "open")],
    ["관찰 중", count((e) => e.status === "watch")],
  ].map(([k, v]) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");

  const tasks = [...new Set(LOG.map((e) => e.task))];
  $("f-task").innerHTML = `<option value="">모든 Task</option>` + tasks.map((t) => `<option>${esc(t)}</option>`).join("");

  function render() {
    const type = $("f-type").value, status = $("f-status").value, task = $("f-task").value;
    const q = $("f-q").value.trim().toLowerCase();
    const rows = LOG.filter((e) =>
      (!type || e.type === type) && (!status || e.status === status) && (!task || e.task === task) &&
      (!q || [e.title, e.detail, e.cause, e.resolution, ...(e.refs || [])].join(" ").toLowerCase().includes(q))
    ).slice().reverse(); // 최신순

    $("count").textContent = `${rows.length} / ${LOG.length}건`;
    $("list").innerHTML = rows.length ? rows.map((e) => `
      <article class="entry t-${esc(e.type)}">
        <div class="top">
          <span class="id">${esc(e.id)}</span><span>${esc(e.at)}</span><span>${esc(e.task)}</span>
          <span class="chip c-${esc(e.type)}">${esc(TYPE[e.type] || e.type)}</span>
          <span class="chip c-${esc(e.status)}">${esc(STATUS[e.status] || e.status)}</span>
        </div>
        <h3>${fmt(e.title)}</h3>
        <dl>
          ${e.detail ? `<dt>내용</dt><dd>${fmt(e.detail)}</dd>` : ""}
          ${e.cause ? `<dt>원인</dt><dd>${fmt(e.cause)}</dd>` : ""}
          ${e.resolution ? `<dt>조치</dt><dd>${fmt(e.resolution)}</dd>` : ""}
          ${e.refs?.length ? `<dt>참조</dt><dd class="refs">${e.refs.map((r) => `<code>${esc(r)}</code>`).join("")}</dd>` : ""}
        </dl>
      </article>`).join("") : `<div class="empty">조건에 맞는 기록이 없습니다.</div>`;
  }

  ["f-type", "f-status", "f-task"].forEach((id) => $(id).addEventListener("change", render));
  $("f-q").addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
