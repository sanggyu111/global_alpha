<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAYPOINT 진행 현황</title>

<!--
  ===================================================================
  진행 현황 데이터 — 이 객체만 수정한다. (AGENT.md 13장)
  status: todo | in-progress | review | done | blocked
  check : null(미실행) | true(통과) | false(실패)
  ===================================================================
-->
<script>
const PROGRESS = {
  updatedAt: "2026-10-09",
  currentTask: "T00",

  phases: [
    { id: "plan",   name: "기획",        status: "todo" },
    { id: "design", name: "설계",        status: "todo" },
    { id: "dev",    name: "개발 ⇄ 리뷰", status: "todo" },
    { id: "submit", name: "제출 준비",   status: "todo" },
  ],

  tasks: [
    {
      id: "T00", phase: "plan", title: "프로젝트 구조 · 공통 규칙 · 개발 프로세스 정의",
      status: "review", branch: "docs/dev-process",
      checks: { error: true, spec: true },
      commits: [],
      note: "AGENT.md 13장(개발 프로세스), progress.html 추가. 문서 작업이라 빌드 대상 없음.",
    },
    {
      id: "T01", phase: "plan", title: "기획 — docs/01-planning.md",
      status: "todo", branch: "docs/planning",
      checks: { error: null, spec: null }, commits: [], note: "",
    },
    {
      id: "T02", phase: "design", title: "설계 — docs/02-design.md (ERD · API · 동시성 · Task 목록)",
      status: "todo", branch: "docs/design",
      checks: { error: null, spec: null }, commits: [], note: "개발 Task(T03~)는 설계 완료 시 이 목록에 추가",
    },
  ],

  // 과제 필수 요구사항 (PDF 2.3) — 우선순위 순
  requirements: [
    { id: "R2", name: "예약 생성 · 재고 선점 (초과예약 방지)", status: "todo" },
    { id: "R3", name: "결제 · 모의 PG · 중복 콜백 멱등 · 보상 처리", status: "todo" },
    { id: "R5", name: "예약 취소 · 환불 금액 계산 · 재고 복원", status: "todo" },
    { id: "R1", name: "숙소 / 객실 조회 (가용 재고 · 날짜별 요금)", status: "todo" },
    { id: "R6", name: "조회 화면 (사용자 · 관리자)", status: "todo" },
    { id: "R4", name: "결제 취소 재시도 (최대 횟수 · 운영자 분류)", status: "todo" },
  ],

  // README 에 답해야 하는 8개 질문 (PDF 2.4)
  questions: [
    { id: "Q1", name: "기술 선택 이유 (필수)", status: "todo" },
    { id: "Q2", name: "초과예약 방지 방법과 깨지는 조건", status: "todo" },
    { id: "Q3", name: "동시성 테스트로 증명 (실행 결과 첨부)", status: "todo" },
    { id: "Q4", name: "트랜잭션 경계와 멱등성", status: "todo" },
    { id: "Q5", name: "프론트 서버/클라이언트 경계 · 캐싱", status: "todo" },
    { id: "Q6", name: "재고 불일치 감지와 복구", status: "todo" },
    { id: "Q7", name: "처음 써본 것과 익힌 방법 (필수)", status: "todo" },
    { id: "Q8", name: "시간이 더 있었다면", status: "todo" },
  ],

  // 제출 직전 체크리스트 (PDF 부록 B)
  submission: [
    { name: "README 에 8개 질문 답 전부", done: false },
    { name: "배포 URL 접속 확인 (시크릿 창)", done: false },
    { name: "README 커맨드만으로 clean clone 실행", done: false },
    { name: ".env / 비밀번호 / 키가 이력에 없음", done: false },
    { name: "DDL / 마이그레이션 포함", done: false },
    { name: "동시성 테스트 통과", done: false },
    { name: "환불 금액 계산 테스트", done: false },
    { name: "배포처 · 이유 · 막힌 지점 기록", done: false },
    { name: "미구현 항목 기록", done: false },
    { name: "실제 투입 시간 기록", done: false },
  ],
};
</script>

<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #e2e6eb;
    --accent: #0f6e63;
    --todo: #8a94a3; --progress: #2563eb; --review: #b45309; --done: #15803d; --blocked: #b91c1c;
    --chip-bg: #eef1f4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --surface: #171b21; --text: #e6e9ee; --muted: #9aa4b2; --line: #2a3039;
      --accent: #3fb8a8;
      --todo: #7d8794; --progress: #60a5fa; --review: #f59e0b; --done: #4ade80; --blocked: #f87171;
      --chip-bg: #222831;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --surface: #171b21; --text: #e6e9ee; --muted: #9aa4b2; --line: #2a3039;
    --accent: #3fb8a8;
    --todo: #7d8794; --progress: #60a5fa; --review: #f59e0b; --done: #4ade80; --blocked: #f87171;
    --chip-bg: #222831;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }

  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 24px; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
  h1 small { color: var(--muted); font-weight: 500; font-size: 0.9rem; margin-left: 6px; }
  .meta { color: var(--muted); font-size: 0.85rem; }

  h2 { font-size: 1rem; margin: 32px 0 12px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }

  /* 현재 Task */
  .current { border-left: 4px solid var(--accent); }
  .current .label { font-size: 0.75rem; color: var(--accent); font-weight: 700; letter-spacing: 0.04em; }
  .current .title { font-size: 1.1rem; font-weight: 600; margin: 4px 0 8px; }
  .current .row { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: 0.85rem; }

  /* 단계 */
  .phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
  .phase { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .phase .n { font-size: 0.75rem; color: var(--muted); }
  .phase .name { font-weight: 600; margin: 2px 0 8px; }
  .bar { height: 6px; background: var(--chip-bg); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .phase .pct { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }

  /* 상태 칩 */
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 99px;
    background: var(--chip-bg); font-size: 0.75rem; font-weight: 600; white-space: nowrap;
  }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .s-todo { color: var(--todo); } .s-in-progress { color: var(--progress); } .s-review { color: var(--review); }
  .s-done { color: var(--done); } .s-blocked { color: var(--blocked); }

  /* Task 표 */
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; min-width: 720px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 0.75rem; color: var(--muted); font-weight: 600; background: var(--chip-bg); }
  tr:last-child td { border-bottom: 0; }
  tr.is-current td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  td.id { font-weight: 700; font-variant-numeric: tabular-nums; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 0.8rem; background: var(--chip-bg); padding: 1px 5px; border-radius: 4px; }
  .note { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
  .check { font-size: 0.8rem; white-space: nowrap; }
  .ok { color: var(--done); } .fail { color: var(--blocked); } .none { color: var(--todo); }

  /* 요구사항 / 질문 / 체크리스트 */
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  ul.list li:last-child { border-bottom: 0; }
  ul.list .k { font-weight: 700; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .card h3 { font-size: 0.85rem; margin: 0 0 4px; color: var(--muted); font-weight: 600; }
  .box { width: 16px; height: 16px; border: 1.5px solid var(--line); border-radius: 4px; flex: none; display: grid; place-items: center; font-size: 11px; }
  .box.on { background: var(--done); border-color: var(--done); color: #fff; }
  ul.list.checklist li { justify-content: flex-start; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>STAYPOINT <small>호텔 예약 과제 진행 현황</small></h1>
    <div class="meta" id="updated"></div>
  </header>

  <section class="card current" id="current"></section>

  <h2>단계</h2>
  <div class="phases" id="phases"></div>

  <h2>Task</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>Task</th><th>상태</th><th>브랜치</th><th>오류 검사</th><th>설계 충족</th><th>커밋</th></tr></thead>
      <tbody id="tasks"></tbody>
    </table>
  </div>

  <h2>평가 대응</h2>
  <div class="grid2">
    <div class="card"><h3>필수 요구사항 (우선순위 순)</h3><ul class="list" id="reqs"></ul></div>
    <div class="card"><h3>README 8개 질문</h3><ul class="list" id="qs"></ul></div>
  </div>

  <h2>제출 직전 체크리스트</h2>
  <div class="card"><ul class="list checklist" id="submit"></ul></div>
</div>

<script>
(() => {
  const P = PROGRESS;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const LABEL = { "todo": "대기", "in-progress": "진행 중", "review": "리뷰", "done": "완료", "blocked": "막힘" };
  const chip = (s) => `<span class="chip s-${esc(s)}">${esc(LABEL[s] || s)}</span>`;
  const check = (v) => v === true ? `<span class="check ok">✔ 통과</span>`
                    : v === false ? `<span class="check fail">✘ 실패</span>`
                    : `<span class="check none">— 미실행</span>`;

  $("updated").textContent = `마지막 갱신 ${P.updatedAt}`;

  // 현재 Task
  const cur = P.tasks.find((t) => t.id === P.currentTask);
  $("current").innerHTML = cur ? `
    <div class="label">현재 TASK</div>
    <div class="title">${esc(cur.id)} · ${esc(cur.title)}</div>
    <div class="row">${chip(cur.status)}<span>브랜치 <code>${esc(cur.branch)}</code></span>
      <span>오류 검사 ${check(cur.checks.error)}</span><span>설계 충족 ${check(cur.checks.spec)}</span></div>
    ${cur.note ? `<div class="note">${esc(cur.note)}</div>` : ""}` : `<div class="title">진행 중인 Task 없음</div>`;

  // 단계별 진행률 (해당 단계 Task 중 done 비율)
  $("phases").innerHTML = P.phases.map((ph, i) => {
    const ts = P.tasks.filter((t) => t.phase === ph.id);
    const pct = ts.length ? Math.round(ts.filter((t) => t.status === "done").length / ts.length * 100) : 0;
    return `<div class="phase"><div class="n">STEP ${i + 1}</div><div class="name">${esc(ph.name)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="pct">${chip(ph.status)} &nbsp;${ts.length ? `${pct}% · Task ${ts.length}개` : "Task 미정"}</div></div>`;
  }).join("");

  // Task 표
  $("tasks").innerHTML = P.tasks.map((t) => `
    <tr class="${t.id === P.currentTask ? "is-current" : ""}">
      <td class="id">${esc(t.id)}</td>
      <td>${esc(t.title)}${t.note ? `<div class="note">${esc(t.note)}</div>` : ""}</td>
      <td>${chip(t.status)}</td>
      <td><code>${esc(t.branch)}</code></td>
      <td>${check(t.checks.error)}</td>
      <td>${check(t.checks.spec)}</td>
      <td>${t.commits.length ? t.commits.map((c) => `<code>${esc(c)}</code>`).join(" ") : `<span class="none">—</span>`}</td>
    </tr>`).join("");

  const items = (arr) => arr.map((r) => `<li><span><span class="k">${esc(r.id)}</span>${esc(r.name)}</span>${chip(r.status)}</li>`).join("");
  $("reqs").innerHTML = items(P.requirements);
  $("qs").innerHTML = items(P.questions);

  $("submit").innerHTML = P.submission.map((s) =>
    `<li><span class="box ${s.done ? "on" : ""}">${s.done ? "✔" : ""}</span><span>${esc(s.name)}</span></li>`).join("");
})();
</script>
</body>
</html>
